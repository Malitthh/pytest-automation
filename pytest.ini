[pytest]
# All tests live under the e2e/ folder.
testpaths = e2e

import-mode = importlib

pythonpath = src

addopts =
    -v
    --strict-markers
    --html=reports/CalculatorNet_Report.html
    --self-contained-html
    --browser chromium

# Custom markers used to filter tests.
markers =
    calculatornet: tests for the CalculatorNet
    smoke: core valid scenarios
    edge: negative and edge-case scenarios