[pytest]
# All end-to-end tests live under the e2e/ directory.
testpaths = e2e

# Use importlib to avoid import conflicts and remove the need for __init__.py files.
import-mode = importlib

# Allow imports from the src/ folder without modifying sys.path manually.
# Example:
#   from core.base_page import BasePage
#   from utils.env_utils import get_env
#   from CalculatorNet.pages.financial.repayment_calculator_page import RepaymentCalculatorPage
pythonpath = src

# Default options applied whenever pytest runs.
addopts =
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --browser chromium

# Custom markers used to group and filter tests.
markers =
    smoke: core happy-path calculations
    edge: boundary and edge-case scenarios
    calculatornet: tests for the CalculatorNet section